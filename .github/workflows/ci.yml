# CI: todo PR (e push na main) passa pelo lint dos notebooks/app e pela validação do bundle.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:                      # nome usado pela proteção da main (infra/github)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ruff nbformat
      - name: Lint (notebooks e app)
        run: ruff check notebooks app
      - name: Notebooks válidos
        run: python -c "import glob, nbformat; [nbformat.validate(nbformat.read(f, 4)) for f in glob.glob('notebooks/*.ipynb')]"

      - uses: databricks/setup-cli@main
      - name: Bundle válido
        run: databricks bundle validate -t prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

# CI: qualidade de código em todo PR e push na main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Testes (pytest)
        run: pytest
      - name: Notebooks válidos
        run: python -m scripts.validate_notebooks

  bundle-validate:
    name: bundle-validate
    runs-on: ubuntu-latest
    needs: test
    # PRs de forks não recebem secrets: só valida quando o token existe
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: databricks bundle validate (prod)
        run: databricks bundle validate -t prod

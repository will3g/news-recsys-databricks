# Todo dia às 06:00 (Brasília): baixa o sitemap, envia para o Volume e roda o Job.
# Fica no GitHub porque o Databricks Free Edition não acessa a internet.
name: ingest

on:
  schedule:
    - cron: "0 9 * * *"     # 09:00 UTC = 06:00 em Brasília
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: make sitemap SCHEMA=news_recsys
      - run: databricks bundle run recsys -t prod

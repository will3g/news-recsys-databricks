# CD: todo merge na main publica o bundle (job + notebooks + src) no target prod.
# O Streamlit Community Cloud se re-publica sozinho a cada push na main.
name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-prod
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: databricks bundle validate
        run: databricks bundle validate -t prod
      - name: databricks bundle deploy
        run: databricks bundle deploy -t prod
      - name: Resumo
        run: databricks bundle summary -t prod

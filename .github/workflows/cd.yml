# CD: merge na develop → QA · merge na main → PROD.
# Em cada ambiente: cria schema/Volume (se faltar), publica o Job e roda o pipeline inteiro.
# (Cada app do Streamlit Cloud se atualiza sozinho a partir da sua branch.)
name: cd

on:
  push:
    branches: [develop, main]

concurrency: cd-${{ github.ref_name }}   # um deploy por vez em cada ambiente

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'qa' }}
    env:
      TARGET: ${{ github.ref_name == 'main' && 'prod' || 'qa' }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: make setup deploy run TARGET=$TARGET

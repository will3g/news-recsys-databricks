[project]
name = "news-recsys"
version = "0.1.0"
description = "Recomendação de notícias com MLOps no Databricks — aula FIAP Pós-Tech Fase 5"
requires-python = ">=3.12"
authors = [{ name = "William Paulo de Oliveira" }]

dependencies = [
    "requests>=2.32.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
databricks = ["databricks-sdk>=0.40.0", "mlflow[databricks]>=3.1.0"]
app = ["streamlit>=1.40.0", "databricks-sql-connector>=4.0.0", "pyarrow>=16.0.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "nbformat>=5.10.0",
    "matplotlib>=3.9.0",
    "pyarrow>=16.0.0",
    "streamlit>=1.40.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["news_recsys*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"scripts/nb/*" = ["E501"]  # conteúdo de células (markdown/código)
"tests/*" = ["N803", "N806"]  # nomes de matriz (X) em testes
"src/news_recsys/models/*" = ["N803", "N806"]

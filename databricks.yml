# Databricks Asset Bundle: descreve o Job em código e publica com `make deploy`.
bundle:
  name: news-recsys-databricks

include:
  - resources/*.yml

variables:
  schema:
    description: Schema das tabelas e do Volume (dentro do catálogo "workspace")
    default: news_recsys_dev

targets:
  dev:                   # make deploy  → sua cópia, com prefixo [dev <usuário>]
    mode: development
    default: true

  prod:                  # GitHub Actions (cd.yml)
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/prod
    run_as:
      user_name: ${workspace.current_user.userName}
    variables:
      schema: news_recsys
